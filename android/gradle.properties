// yubtc Android — Gradle properties.
//
// Toggles the standard Compose / Kotlin / AndroidX knobs. JVM args
// are tuned for medium-sized modules — Android Studio's default
// (`-Xmx2048m`) is fine but we bump a little for KSP.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
