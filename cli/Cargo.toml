[package]
name = "yubtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native CLI for the yubtc Bitcoin wallet (Rust core + clap)."

[[bin]]
name = "yubtc"
path = "src/main.rs"

[dependencies]
yubtc-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util"] }
ratatui = "0.29"
crossterm = "0.28"
rpassword = "7"
hex = { workspace = true }
serde_json = { workspace = true }
thiserror = "1.0"
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
ntest_timeout = { workspace = true }
wiremock = "0.6"
serial_test = "3"
serde_json = "1"
async-trait = "0.1"